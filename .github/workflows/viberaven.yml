# Generated by viberaven init --github. Review both workflows before committing.
name: VibeRaven
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned VibeRaven outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          tool_dir=$(mktemp -d "$RUNNER_TEMP/viberaven-tool.XXXXXX")
          cd "$tool_dir"
          export NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_GLOBALCONFIG=/dev/null
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false --registry=https://registry.npmjs.org @viberaven/cli@1.7.8
          echo "VR_HELPER=$tool_dir/node_modules/@viberaven/cli/dist/github-ci.js" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check exact pull request head
        env:
          VR_REPORT_DIR: ${{ runner.temp }}/viberaven-report
        run: node "$VR_HELPER" scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: viberaven-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/viberaven-report/report.json
          if-no-files-found: error
          retention-days: 1
          archive: true
