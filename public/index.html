<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes board</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; min-height: 60px; padding: 8px; font: inherit; border: 1px solid #bbb; border-radius: 8px; }
  button { padding: 0 18px; font: inherit; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  #status { min-height: 24px; margin: 8px 0; }
  #status.error { color: #b00020; }
  #status.ok { color: #0a7a2f; }
  ul { list-style: none; padding: 0; }
  li { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  time { display: block; color: #666; font-size: 12px; }
</style>
</head>
<body>
<h1>Notes board</h1>
<form id="form">
  <textarea id="text" placeholder="Write a note"></textarea>
  <button type="submit">Save</button>
</form>
<p id="status" role="status"></p>
<ul id="notes"></ul>
<script>
  const status = document.getElementById('status');
  const list = document.getElementById('notes');
  function show(message, kind) { status.textContent = message; status.className = kind; }
  async function load() {
    const notes = await fetch('/api/notes').then((res) => res.json());
    list.innerHTML = '';
    for (const note of notes) {
      const item = document.createElement('li');
      item.textContent = note.body;
      const when = document.createElement('time');
      when.textContent = note.created_at;
      item.append(when);
      list.append(item);
    }
  }
  document.getElementById('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const text = document.getElementById('text').value;
    const res = await fetch('/api/notes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) });
    const data = await res.json();
    if (!res.ok) { show(data.error, 'error'); return; }
    document.getElementById('text').value = '';
    show('Saved.', 'ok');
    await load();
  });
  load();
</script>
</body>
</html>
